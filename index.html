    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // Local Date Parser
        const parseLocalDate = (dateVal) => {
            if (!dateVal) return new Date();
            if (dateVal instanceof Date) return new Date(dateVal.getFullYear(), dateVal.getMonth(), dateVal.getDate());
            if (typeof dateVal === 'string' && dateVal.includes('-')) {
                const parts = dateVal.split('T')[0].split('-');
                if (parts.length === 3) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10) - 1;
                    const d = parseInt(parts[2], 10);
                    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
                        return new Date(y, m, d);
                    }
                }
            }
            return new Date(dateVal);
        };

        // Date Formatter Helper
        const format = (date, fmt) => {
            const d = parseLocalDate(date);
            if (isNaN(d.getTime())) return '';
            const yyyy = d.getFullYear();
            const MM = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const MMMM = monthNames[d.getMonth()];
            const MMM = MMMM ? MMMM.substring(0, 3) : '';
            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const EEEE = dayNames[d.getDay()];
            const nth = (day) => {
                if (day > 3 && day < 21) return 'th';
                switch (day % 10) {
                    case 1: return "st"; case 2: return "nd"; case 3: return "rd"; default: return "th";
                }
            };
            const do_str = d.getDate() + nth(d.getDate());

            if (fmt === 'yyyy-MM-dd') return `${yyyy}-${MM}-${dd}`;
            if (fmt === 'yyyy-MM') return `${yyyy}-${MM}`;
            if (fmt === 'd') return String(d.getDate());
            if (fmt === 'MMMM yyyy') return `${MMMM} ${yyyy}`;
            if (fmt === 'MMM do, yyyy') return `${MMM} ${do_str}, ${yyyy}`;
            if (fmt === 'EEEE, MMMM do, yyyy') return `${EEEE}, ${MMMM} ${do_str}, ${yyyy}`;
            if (fmt === 'do') return do_str;
            if (fmt === 'MMM d') return `${MMM} ${d.getDate()}`;
            return d.toString();
        };

        const startOfMonth = (date) => {
            const d = parseLocalDate(date);
            return new Date(d.getFullYear(), d.getMonth(), 1);
        };
        const endOfMonth = (date) => {
            const d = parseLocalDate(date);
            return new Date(d.getFullYear(), d.getMonth() + 1, 0);
        };
        
        const eachDayOfInterval = ({ start, end }) => {
            const arr = [];
            let dt = parseLocalDate(start);
            const stop = parseLocalDate(end);
            while (dt <= stop) {
                arr.push(new Date(dt));
                dt.setDate(dt.getDate() + 1);
            }
            return arr;
        };
        
        const isSameDay = (d1, d2) => {
            const a = parseLocalDate(d1); 
            const b = parseLocalDate(d2);
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        };
        
        const addMonths = (date, amount) => {
            const d = parseLocalDate(date); 
            d.setMonth(d.getMonth() + amount); 
            return d;
        };
        
        const subMonths = (date, amount) => {
            const d = parseLocalDate(date); 
            d.setMonth(d.getMonth() - amount); 
            return d;
        };
        
        const getDay = (date) => parseLocalDate(date).getDay();
        const startOfDay = (date) => {
            const d = parseLocalDate(date);
            d.setHours(0, 0, 0, 0);
            return d;
        };
        
        const differenceInDays = (d1, d2) => {
            const t1 = startOfDay(d1).getTime();
            const t2 = startOfDay(d2).getTime();
            return Math.round((t1 - t2) / (1000 * 60 * 60 * 24));
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const getEntryKey = (item) => {
            if (!item) return '';
            if (item.fingerprintKey) return item.fingerprintKey;
            const datePart = item.date || '';
            const descPart = (item.description || item.title || '').trim().toLowerCase();
            const amountPart = Number(item.amount || 0).toFixed(2);
            const accPart = (item.accountId || '').toLowerCase();
            return `${datePart}_${descPart}_${amountPart}_${accPart}`;
        };

        const App = () => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [realTime, setRealTime] = useState(new Date());
            
            useEffect(() => {
                const timer = setInterval(() => setRealTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const [tasks, setTasks] = useState([]);
            const [reminders, setReminders] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [goals, setGoals] = useState([]);
            const [bills, setBills] = useState([]);

            const [incomes, setIncomes] = useState([]);
            const [transfers, setTransfers] = useState([]);

            const [stocks, setStocks] = useState([]);
            const [loans, setLoans] = useState([]);
            const [savingsList, setSavingsList] = useState([]);
            const [removedEntries, setRemovedEntries] = useState([]);

            const [weddingData, setWeddingData] = useState({
                required: '',
                loan: '',
                other: ''
            });

            const defaultAccounts = [
                { id: 'hdfc', name: 'HDFC Bank', openingBalance: 0, openingDate: format(new Date(), 'yyyy-MM-dd') },
                { id: 'idfc', name: 'IDFC Bank', openingBalance: 0, openingDate: format(new Date(), 'yyyy-MM-dd') },
                { id: 'indus', name: 'IndusInd Bank', openingBalance: 0, openingDate: format(new Date(), 'yyyy-MM-dd') },
                { id: 'cash', name: 'Cash', openingBalance: 0, openingDate: format(new Date(), 'yyyy-MM-dd') },
            ];
            const [accounts, setAccounts] = useState(defaultAccounts);
            const [debtors, setDebtors] = useState([]);

            // Default Habit State (Starting July 30, 2026)
            const defaultHabits = [
                { id: 'h1', title: 'Not smoking a cigarette', category: 'Health' },
                { id: 'h2', title: 'Not watching porn', category: 'Mindset' },
                { id: 'h3', title: 'Not drinking tea', category: 'Diet' },
                { id: 'h4', title: 'Clean Edibles / No Sugar', category: 'Nutrition' }
            ];
            const [habits, setHabits] = useState(defaultHabits);
            const [habitLogs, setHabitLogs] = useState({}); // { habitId: { '2026-07-30': true } }
            const [habitNotes, setHabitNotes] = useState({}); // { '2026-07-30': "Note text..." }
            const [selectedHabitFilter, setSelectedHabitFilter] = useState('all');
            const [habitMonthDates, setHabitMonthDates] = useState({}); // { habitId: Date }

            const [activeTab, setActiveTab] = useState('expenses'); // expenses, habits, balance, debtors, loans, stocks, budget, savings, wedding, goals, data, removed
            const [budgetMap, setBudgetMap] = useState({}); 
            const [excludedIds, setExcludedIds] = useState([]);
            const [dataMonthFilter, setDataMonthFilter] = useState('all');

            const [heatmapMin, setHeatmapMin] = useState(300);
            const [heatmapMax, setHeatmapMax] = useState(5000);

            // Modals
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [isReminderModalOpen, setIsReminderModalOpen] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [isBillModalOpen, setIsBillModalOpen] = useState(false);
            const [isEditBillModalOpen, setIsEditBillModalOpen] = useState(false);
            const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
            const [isDebtorModalOpen, setIsDebtorModalOpen] = useState(false);
            const [isIncomeModalOpen, setIsIncomeModalOpen] = useState(false);
            const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
            const [isStockModalOpen, setIsStockModalOpen] = useState(false);
            const [isLoanModalOpen, setIsLoanModalOpen] = useState(false);
            const [isSavingsModalOpen, setIsSavingsModalOpen] = useState(false);
            const [isHabitModalOpen, setIsHabitModalOpen] = useState(false);
            const [gearAccountModal, setGearAccountModal] = useState(null);
            const [isResetModalOpen, setIsResetModalOpen] = useState(false);

            // Forms
            const [newTask, setNewTask] = useState({ title: '', type: 'one-time' });
            const [newReminder, setNewReminder] = useState({ text: '', type: 'one-time' });
            const [newExpense, setNewExpense] = useState({ amount: '', description: '', accountId: 'hdfc', category: 'Personal' });
            const [newBill, setNewBill] = useState({ title: '', amount: '', type: 'one-time', accountId: 'hdfc' });
            const [editingBill, setEditingBill] = useState(null);
            const [newGoal, setNewGoal] = useState({ title: '', targetDate: format(new Date(), 'yyyy-MM-dd') });
            const [newDebtor, setNewDebtor] = useState({ name: '', amount: '', note: '', dueDate: format(new Date(), 'yyyy-MM-dd') });
            const [newIncome, setNewIncome] = useState({ source: '', amount: '', accountId: 'hdfc', date: format(new Date(), 'yyyy-MM-dd') });
            const [newTransfer, setNewTransfer] = useState({ amount: '', fromAccountId: 'idfc', toAccountId: 'hdfc', note: '' });
            const [newStock, setNewStock] = useState({ name: '', valuation: '', note: '' });
            const [newLoan, setNewLoan] = useState({ name: '', amount: '', loanType: 'credit_card', bankName: '', emi: '', note: '' });
            const [newSavings, setNewSavings] = useState({ name: '', amount: '', category: 'Bank FD / Deposit', note: '' });
            const [newHabit, setNewHabit] = useState({ title: '', category: 'Health' });

            const [isSyncing, setIsSyncing] = useState(false);
            const [isTriggeringAlerts, setIsTriggeringAlerts] = useState(false);
            const [alertNotice, setAlertNotice] = useState(null);
            const [hasLoadedFromDB, setHasLoadedFromDB] = useState(false);

            const synthRef = useRef(null);
            
            const DAILY_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-koILijAnRHIMZkEQI97_SUOmVIgK9RWBQmLzH6PxWV6bfWJdjiewg0K91duENAil/exec';
            const FETCH_ALERTS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5yEPu9w-QRYLGhalxMsnBBF6UVq03hjgU84iXyZ2YCLRiQq6oqTrHXjC5Qw_ZZYCn/exec';

            const initAudio = () => {
                try {
                    if (!synthRef.current && window.Tone) {
                        synthRef.current = new Tone.MembraneSynth({
                            pitchDecay: 0.01,
                            octaves: 1.2,
                            oscillator: { type: "sine" },
                            envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.08 }
                        }).toDestination();
                        Tone.start();
                    }
                } catch(e) {}
            };

            const playClickSound = () => {
                try {
                    initAudio();
                    if (synthRef.current) synthRef.current.triggerAttackRelease("D2", "32n", Tone.now(), 0.2);
                } catch(e) {}
            };

            const playPageFlipSound = () => {
                try {
                    initAudio();
                    if (synthRef.current) synthRef.current.triggerAttackRelease("F2", "16n", Tone.now(), 0.1);
                } catch(e) {}
            };

            const triggerFetchBankAlerts = async () => {
                playClickSound();
                setIsTriggeringAlerts(true);
                setAlertNotice("Syncing live bank alerts...");
                try {
                    await fetch(FETCH_ALERTS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'fetchBankAlerts' })
                    });
                    setAlertNotice("Data updated successfully.");
                    setTimeout(() => window.location.reload(), 2000);
                } catch (err) {
                    setAlertNotice("Sync notice: Local mode active.");
                    setTimeout(() => setAlertNotice(null), 3000);
                } finally {
                    setIsTriggeringAlerts(false);
                }
            };

            const dateStr = (date) => format(date, 'yyyy-MM-dd');
            const selectedDateStr = dateStr(selectedDate);

            useEffect(() => {
            let unsubscribe;
            const initFirebase = async () => {
                // Wait briefly for the module script variables to attach to the window
                while (!window.firebaseDB) {
                    await new Promise(r => setTimeout(r, 50));
                }
                try {
                    let user = window.firebaseAuth.currentUser;
                    if (!user) {
                        // Skip the custom token check and use Anonymous Auth directly for your custom Firebase project
                        const cred = await window.signInAnonymously(window.firebaseAuth);
                        user = cred.user;
                    }
                    
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'classic-ledger';
                    // Changed to a shared public path so all devices read the exact same document
                    const docRef = window.firebaseDoc(window.firebaseDB, 'artifacts', appId, 'public', 'data', 'shared_ledger', 'state');
                        
                    // Listen in real-time to Firestore doc changes
                    unsubscribe = window.firebaseOnSnapshot(docRef, (docSnap) => {
                            if (docSnap.exists()) {
                                const data = docSnap.data();
                                if (data.tasks) setTasks(data.tasks);
                                if (data.reminders) setReminders(data.reminders);
                                if (data.expenses) setExpenses(data.expenses);
                                if (data.budgetMap) setBudgetMap(data.budgetMap);
                                if (data.bills) setBills(data.bills);
                                if (data.goals) setGoals(data.goals);
                                if (data.accounts) setAccounts(data.accounts);
                                if (data.debtors) setDebtors(data.debtors);
                                if (data.excludedIds) setExcludedIds(data.excludedIds);
                                if (data.heatmapMin) setHeatmapMin(data.heatmapMin);
                                if (data.heatmapMax) setHeatmapMax(data.heatmapMax);
                                if (data.incomes) setIncomes(data.incomes);
                                if (data.transfers) setTransfers(data.transfers);
                                if (data.stocks) setStocks(data.stocks);
                                if (data.loans) setLoans(data.loans);
                                if (data.savingsList) setSavingsList(data.savingsList);
                                if (data.weddingData) setWeddingData(data.weddingData);
                                if (data.removedEntries) setRemovedEntries(data.removedEntries);
                                if (data.habits) setHabits(data.habits);
                                if (data.habitLogs) setHabitLogs(data.habitLogs);
                                if (data.habitNotes) setHabitNotes(data.habitNotes);
                            }
                            setHasLoadedFromDB(true);
                        }, (err) => console.error("Firestore sync error:", err));
                    } catch (err) {
                        console.error("Firebase auth/load error:", err);
                        setHasLoadedFromDB(true); // Allow interactions even if offline
                    }
                };
                
                initFirebase();

                const fetchSheetData = async () => {
                    setIsSyncing(true);
                    try {
                        const [dailyRes] = await Promise.allSettled([
                            fetch(DAILY_SCRIPT_URL, { method: 'GET', redirect: 'follow' })
                        ]);
                        if (dailyRes.status === 'fulfilled' && dailyRes.value.ok) {
                            const text = await dailyRes.value.text();
                            try {
                                const data = JSON.parse(text);
                                if (data.expenses) setExpenses(data.expenses.map(e => ({ ...e, id: e.id || generateId() })));
                                if (data.tasks) setTasks(data.tasks.map(t => ({ ...t, id: t.id || generateId() })));
                                if (data.goals) setGoals(data.goals.map(g => ({ ...g, id: g.id || generateId() })));
                            } catch (e) {}
                        }
                    } catch (error) {
                    } finally {
                        setIsSyncing(false);
                    }
                };
                fetchSheetData();

                return () => { if (unsubscribe) unsubscribe(); };
            }, []);

            useEffect(() => {
                // Prevent saving default empty state back to DB before the real data is fetched
                if (!hasLoadedFromDB || !window.firebaseDB || !window.firebaseAuth?.currentUser) return;
                
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'classic-ledger';
                // Changed to a shared public path so all devices write to the exact same document
                const docRef = window.firebaseDoc(window.firebaseDB, 'artifacts', appId, 'public', 'data', 'shared_ledger', 'state');
                
                const saveData = {
                    tasks, reminders, expenses, budgetMap, bills, goals, accounts, debtors, excludedIds,
                    heatmapMin, heatmapMax, incomes, transfers, stocks, loans, savingsList, weddingData,
                    removedEntries, habits, habitLogs, habitNotes
                };
                
                window.firebaseSetDoc(docRef, saveData, { merge: true }).catch(console.error);
            }, [hasLoadedFromDB, tasks, reminders, expenses, budgetMap, bills, goals, accounts, debtors, excludedIds, heatmapMin, heatmapMax, incomes, transfers, stocks, loans, savingsList, weddingData, removedEntries, habits, habitLogs, habitNotes]);

            // Set of removed identifiers
            const removedKeysSet = useMemo(() => {
                const keys = new Set();
                removedEntries.forEach(r => {
                    if (r.id) keys.add(r.id);
                    if (r.fingerprintKey) keys.add(r.fingerprintKey);
                    const calculatedKey = getEntryKey(r);
                    if (calculatedKey) keys.add(calculatedKey);
                });
                return keys;
            }, [removedEntries]);

            const activeExpenses = useMemo(() => {
                return expenses.filter(e => {
                    const itemKey = getEntryKey(e);
                    const isExcluded = excludedIds.includes(e.id) || excludedIds.includes(itemKey);
                    const isRemoved = removedKeysSet.has(e.id) || removedKeysSet.has(itemKey);
                    return !isExcluded && !isRemoved;
                });
            }, [expenses, excludedIds, removedKeysSet]);

            const activeBills = useMemo(() => {
                return bills.filter(b => {
                    const itemKey = getEntryKey(b);

            const monthEnd = endOfMonth(monthStart);

                const minVal = Math.max(1, Number(heatmapMin) || 100);
                const maxVal = Math.max(minVal + 10, Number(heatmapMax) || 5000);
                const step = (maxVal - minVal) / 5;

                if (spend < minVal) return 'bg-emerald-50 text-emerald-950 border-emerald-200 hover:bg-emerald-100/80'; 
                if (spend < minVal + step * 1) return 'bg-lime-50 text-lime-950 border-lime-200 hover:bg-lime-100/80';      
                if (spend < minVal + step * 2) return 'bg-amber-50 text-amber-950 border-amber-200 hover:bg-amber-100/80';   
                if (spend < minVal + step * 3) return 'bg-orange-100 text-orange-950 border-orange-300 hover:bg-orange-200/80';
                if (spend < maxVal) return 'bg-rose-100 text-rose-950 border-rose-300 hover:bg-rose-200/80';

                const hasTasksOrReminders = checkItems(activeTasks) || checkItems(reminders);
                let dayCalendarAmount = 0;

                    const matchingBills = activeBills.filter(bill => {

                        if (isNaN(billDate.getTime())) return false;
                        if (bill.type === 'one-time') return bill.date === dayDateString;
                        if (bill.type === 'recurring') return billDate <= targetDay && parseLocalDate(bill.date).getDate() === day.getDate();

                        {/* Active Tab View */}
                        <div className="page-fade" key={`content-${activeTab}`}>
                            
                            {/* EXPENSES TAB */}
                            {activeTab === 'expenses' && (

                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </select>
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsEditBillModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Update Item</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Income Modal */}
                        {isIncomeModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Record Income / Salary</h3>
                                    <form onSubmit={handleAddIncome} className="space-y-3">
                                        <input type="text" autoFocus required placeholder="Source..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newIncome.source} onChange={e => setNewIncome({...newIncome, source: e.target.value})} />
                                        <input type="number" step="0.01" required placeholder="Amount (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newIncome.amount} onChange={e => setNewIncome({...newIncome, amount: e.target.value})} />
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newIncome.accountId} onChange={e => setNewIncome({...newIncome, accountId: e.target.value})}>
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </select>
                                        <input type="date" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newIncome.date} onChange={e => setNewIncome({...newIncome, date: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsIncomeModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-emerald-700 text-white rounded-lg font-medium">Record Income</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Transfer Modal */}
                        {isTransferModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Inter-Bank Fund Transfer</h3>
                                    <form onSubmit={handleAddTransfer} className="space-y-3">
                                        <input type="number" step="0.01" required placeholder="Transfer Amount (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newTransfer.amount} onChange={e => setNewTransfer({...newTransfer, amount: e.target.value})} />
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newTransfer.fromAccountId} onChange={e => setNewTransfer({...newTransfer, fromAccountId: e.target.value})}>
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </select>
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newTransfer.toAccountId} onChange={e => setNewTransfer({...newTransfer, toAccountId: e.target.value})}>
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </select>
                                        <input type="text" placeholder="Note..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newTransfer.note} onChange={e => setNewTransfer({...newTransfer, note: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsTransferModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Execute Transfer</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Stock Modal */}
                        {isStockModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Stock Investment Entry</h3>
                                    <form onSubmit={handleAddStock} className="space-y-3">
                                        <input type="text" autoFocus required placeholder="Stock Name..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newStock.name} onChange={e => setNewStock({...newStock, name: e.target.value})} />
                                        <input type="number" step="0.01" required placeholder="Current Valuation (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newStock.valuation} onChange={e => setNewStock({...newStock, valuation: e.target.value})} />
                                        <input type="text" placeholder="Notes..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newStock.note} onChange={e => setNewStock({...newStock, note: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsStockModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-emerald-800 text-white rounded-lg font-medium">Save Holding</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Loan Modal */}
                        {isLoanModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Loan / Liability Entry</h3>
                                    <form onSubmit={handleAddLoan} className="space-y-3">
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-slate-900" value={newLoan.loanType} onChange={e => setNewLoan({...newLoan, loanType: e.target.value})}>
                                            <option value="credit_card">1. Credit Card Liability</option>
                                            <option value="bank">2. Bank Loan</option>
                                            <option value="personal">3. Personal Borrowing</option>
                                        </select>
                                        <input type="text" required placeholder="Title..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newLoan.name} onChange={e => setNewLoan({...newLoan, name: e.target.value})} />
                                        <input type="text" placeholder="Bank Name..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newLoan.bankName} onChange={e => setNewLoan({...newLoan, bankName: e.target.value})} />
                                        <input type="number" step="0.01" required placeholder="Outstanding Balance (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newLoan.amount} onChange={e => setNewLoan({...newLoan, amount: e.target.value})} />
                                        <input type="number" step="0.01" placeholder="Monthly EMI" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newLoan.emi} onChange={e => setNewLoan({...newLoan, emi: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsLoanModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Save Entry</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Savings Modal */}
                        {isSavingsModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Savings Asset Entry</h3>
                                    <form onSubmit={handleAddSavings} className="space-y-3">
                                        <input type="text" autoFocus required placeholder="Savings Title..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newSavings.name} onChange={e => setNewSavings({...newSavings, name: e.target.value})} />
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-slate-900" value={newSavings.category} onChange={e => setNewSavings({...newSavings, category: e.target.value})}>
                                            <option value="Bank FD / Deposit">Bank Fixed Deposit (FD/RD)</option>
                                            <option value="Mutual Funds / SIP">Mutual Funds / SIP</option>
                                            <option value="Emergency Fund">Emergency Fund</option>
                                            <option value="Gold / Silver">Gold / Precious Metals</option>
                                            <option value="PPF / EPF / NPS">PPF / EPF / NPS</option>
                                            <option value="Other Savings">Other Savings</option>
                                        </select>
                                        <input type="number" step="0.01" required placeholder="Valuation / Amount (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newSavings.amount} onChange={e => setNewSavings({...newSavings, amount: e.target.value})} />
                                        <input type="text" placeholder="Note..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newSavings.note} onChange={e => setNewSavings({...newSavings, note: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsSavingsModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-teal-800 text-white rounded-lg font-medium">Save Entry</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Opening Balance Modal */}
                        {gearAccountModal && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-1">Configure {gearAccountModal.name}</h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const val = e.target.elements.opVal.value;
                                        const dtVal = e.target.elements.opDate.value;
                                        const targetVal = e.target.elements.adjTarget.value;
                                        handleUpdateOpeningBalance(gearAccountModal.id, val, dtVal, targetVal);
                                    }} className="space-y-4">
                                        <div>
                                            <label className="block text-[10px] font-semibold text-slate-500 uppercase">Opening Balance</label>
                                            <input name="opVal" type="number" step="0.01" required defaultValue={gearAccountModal.openingBalance} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-semibold text-slate-500 uppercase">Opening Date</label>
                                            <input name="opDate" type="date" required defaultValue={gearAccountModal.openingDate} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-semibold text-slate-500 uppercase">Target Balance (Adjust Balance 2)</label>
                                            <input name="adjTarget" type="number" step="0.01" placeholder="Leave empty to keep current adjustment" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" />
                                        </div>
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setGearAccountModal(null)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Save Settings</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Reset Banks Warning Modal */}
                        {isResetModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-rose-200">
                                    <div className="flex items-center gap-3 mb-4 text-rose-600">
                                        <i className="fas fa-exclamation-triangle text-2xl"></i>
                                        <h3 className="font-serif font-bold text-lg text-slate-900">Critical Warning</h3>
                                    </div>
                                    <p className="text-sm text-slate-700 mb-4 font-medium leading-relaxed">
                                        Are you absolutely sure? Pressing this button will make everything zero. 
                                        Every bank account balance, all inflow/outflow history, adjustments, and projected balances will be permanently erased and set to <strong className="text-slate-900">₹0.00</strong>.
                                    </p>
                                    <div className="flex justify-end space-x-3 pt-2 border-t border-slate-100 mt-4">
                                        <button type="button" onClick={() => setIsResetModalOpen(false)} className="px-4 py-2 text-xs border border-slate-300 hover:bg-slate-50 rounded-lg text-slate-700 font-semibold transition-all">
                                            Cancel
                                        </button>
                                        <button type="button" onClick={handleResetAllBanks} className="px-4 py-2 text-xs bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold shadow-md transition-all">
                                            Yes, Make Everything Zero
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Task Modal */}
                        {isTaskModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Task</h3>
                                    <form onSubmit={handleAddTask} className="space-y-4">
                                        <input type="text" autoFocus required placeholder="Task title..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newTask.title} onChange={e => setNewTask({...newTask, title: e.target.value})} />
                                        <div className="flex space-x-4 text-xs text-slate-700">
                                            <label className="flex items-center space-x-1.5"><input type="radio" value="one-time" checked={newTask.type === 'one-time'} onChange={e => setNewTask({...newTask, type: e.target.value})} /><span>One-time</span></label>
                                            <label className="flex items-center space-x-1.5"><input type="radio" value="recurring" checked={newTask.type === 'recurring'} onChange={e => setNewTask({...newTask, type: e.target.value})} /><span>Routine</span></label>
                                        </div>
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Reminder Modal */}
                        {isReminderModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Reminder</h3>
                                    <form onSubmit={handleAddReminder} className="space-y-4">
                                        <input type="text" autoFocus required placeholder="Reminder details..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newReminder.text} onChange={e => setNewReminder({...newReminder, text: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsReminderModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Expense Modal */}
                        {isExpenseModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Log Expense</h3>
                                    <form onSubmit={handleAddExpense} className="space-y-4">
                                        <input type="number" step="0.01" required autoFocus placeholder="Amount (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} />
                                        <input type="text" required placeholder="What was spent on?" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newExpense.description} onChange={e => setNewExpense({...newExpense, description: e.target.value})} />
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-slate-900" value={newExpense.category} onChange={e => setNewExpense({...newExpense, category: e.target.value})}>
                                            <option value="Personal">Personal</option>
                                            <option value="Utilities & Subscriptions">Utilities & Subscriptions</option>
                                            <option value="Household & Supplies">Household & Supplies</option>
                                        </select>
                                        <select className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-slate-900" value={newExpense.accountId} onChange={e => setNewExpense({...newExpense, accountId: e.target.value})}>
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </select>
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Record</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Debtors Modal */}
                        {isDebtorModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Add Debtor Record</h3>
                                    <form onSubmit={handleAddDebtor} className="space-y-3">
                                        <input type="text" required placeholder="Debtor Name..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newDebtor.name} onChange={e => setNewDebtor({...newDebtor, name: e.target.value})} />
                                        <input type="number" step="0.01" required placeholder="Amount to Receive (₹)" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-slate-900" value={newDebtor.amount} onChange={e => setNewDebtor({...newDebtor, amount: e.target.value})} />
                                        <input type="text" placeholder="Note..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newDebtor.note} onChange={e => setNewDebtor({...newDebtor, note: e.target.value})} />
                                        <input type="date" required className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newDebtor.dueDate} onChange={e => setNewDebtor({...newDebtor, dueDate: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsDebtorModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-emerald-800 text-white rounded-lg font-medium">Save Debtor</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Goal Modal */}
                        {isGoalModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200">
                                    <h3 className="font-serif font-bold text-lg text-slate-900 mb-4">Set New Goal</h3>
                                    <form onSubmit={handleAddGoal} className="space-y-4">
                                        <input type="text" autoFocus required placeholder="Goal title..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newGoal.title} onChange={e => setNewGoal({...newGoal, title: e.target.value})} />
                                        <input type="date" required className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-slate-900" value={newGoal.targetDate} onChange={e => setNewGoal({...newGoal, targetDate: e.target.value})} />
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={() => setIsGoalModalOpen(false)} className="px-3.5 py-2 text-xs border border-slate-300 rounded-lg text-slate-600">Cancel</button>
                                            <button type="submit" className="px-3.5 py-2 text-xs bg-slate-900 text-white rounded-lg font-medium">Add Goal</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
